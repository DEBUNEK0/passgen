[package]
name        = "passgen"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.70"
description = "A cryptographically secure CLI password generator"
license     = "MIT"
repository  = "https://github.com/DEBUNEK0/passgen"
readme      = "README.md"
keywords    = ["password", "generator", "cli", "security"]
categories  = ["command-line-utilities"]

# The binary is named `pwgen` so users run `pwgen` after `cargo install`.
[[bin]]
name = "pwgen"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
rand       = "0.8"
thiserror  = "1"
arboard    = "3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
strip     = "symbols"
lto       = true
